name: A-Share Alpha Radar Public Data and Pages

on:
  workflow_dispatch:
  schedule:
    # 17:35 China Standard Time (UTC+8), Monday-Friday.
    - cron: '35 9 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'scripts/collect_public.py'
      - 'site/**'
      - '.github/workflows/alpha-radar-cloud.yml'

permissions:
  contents: write

concurrency:
  group: alpha-radar-public-pages
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout public collector
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect and validate public market snapshot
        env:
          RADAR_OUTPUT_DIR: site/data
          RADAR_MIN_VALID_ROWS: '2500'
          RADAR_MAX_DATA_AGE_DAYS: '7'
          RADAR_MAX_WEEKDAY_GAP: '2'
        run: python scripts/collect_public.py
      - name: Validate generated public snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('site/data/latest.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['data_status'] == 'validated'
          assert d['coverage']['valid_stock_count'] >= 2500
          assert Path('site/index.html').is_file()
          print('Validated:', d['trade_date'], d['coverage']['valid_stock_count'])
          PY
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpha-radar-public-site
          path: site/
          retention-days: 7
      - name: Publish sanitized static site to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}.git" /tmp/pages
          cp site/index.html /tmp/pages/index.html
          mkdir -p /tmp/pages/data/history
          cp site/data/latest.json /tmp/pages/data/latest.json
          cp site/data/history/*.json /tmp/pages/data/history/
          cd /tmp/pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'Public site is unchanged.'
          else
            git commit -m "Publish validated A-share market snapshot"
            git push origin HEAD:gh-pages
          fi
