name: research-full-technical-backfill

on:
  workflow_dispatch:
    inputs:
      max_history_stocks:
        description: "0 = all listed A-shares; positive number = bounded batch"
        required: true
        default: "0"
        type: string
      history_workers:
        description: "Concurrent history providers (keep at 3 or lower)"
        required: true
        default: "3"
        type: string

permissions:
  contents: read

jobs:
  full-technical-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install research dependencies
        run: pip install -r requirements.txt
      - name: Build technical history coverage
        run: python scripts/build_market_technicals.py
        env:
          MAX_HISTORY_STOCKS: ${{ inputs.max_history_stocks }}
          HISTORY_WORKERS: ${{ inputs.history_workers }}
      - name: Compile and evaluate research quality
        run: |
          python -m py_compile scripts/build_market_technicals.py scripts/build_research_quality.py
          python scripts/build_research_quality.py
      - name: Upload full-backfill artifacts for review
        uses: actions/upload-artifact@v4
        with:
          name: research-full-technical-backfill-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            data/technical_coverage.json
            data/technical_history/**
            data/technical_history_archive/**
            data/research_quality.json
