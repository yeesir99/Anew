name: A-share daily close collection

on:
  schedule:
    - cron: "30 11 * * 1-5" # 19:30 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anew-daily-close
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect and analyze close data
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          MAX_HISTORY_STOCKS: "300"
          HISTORY_WORKERS: "4"
        run: python -m src.main close
      - name: Commit data and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          if ! git diff --cached --quiet; then
            git commit -m "chore: update A-share close data and report"
            git push origin HEAD:main
          else
            echo "No changes to commit."
          fi
