name: A-share morning report

on:
  schedule:
    - cron: "10 0 * * *" # 08:10 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anew-morning-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate morning report
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python -m src.main morning
      - name: Commit morning report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish A-share morning report"
            git push origin HEAD:main
          else
            echo "No changes to commit."
          fi
