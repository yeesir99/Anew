name: A-Share Alpha Radar — public GitHub cloud runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'requirements.txt'
      - 'site/**'
      - '.github/workflows/cloud-public.yml'
  schedule:
    - cron: "35 11 * * 1-5" # 19:35 Asia/Shanghai, after the close

permissions:
  contents: write

concurrency:
  group: anew-public-cloud-v2
  cancel-in-progress: true

jobs:
  collect-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout public research source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install public research dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q src scripts
      - name: Collect latest public A-share market data
        id: live
        timeout-minutes: 3
        continue-on-error: true
        env:
          MAX_HISTORY_STOCKS: "5"
          HISTORY_WORKERS: "2"
          TZ: Asia/Shanghai
        run: python -m src.main close
      - name: Collect validated archive fallback if live API is unavailable
        if: steps.live.outcome == 'failure'
        env:
          RADAR_OUTPUT_DIR: .cache/public-fallback
          RADAR_MAX_DATA_AGE_DAYS: "7"
          RADAR_MAX_WEEKDAY_GAP: "5"
          TZ: Asia/Shanghai
        run: python scripts/collect_public.py
      - name: Import recent public sector archive history
        if: always() && !cancelled()
        run: python scripts/import_sector_archive.py
      - name: Run industry momentum backtest (or mark warming up)
        if: always() && !cancelled()
        run: python scripts/backtest_industry.py
      - name: Build validated static dashboard data
        env:
          TZ: Asia/Shanghai
        run: python scripts/build_site_snapshot.py
      - name: Pre-enrichment fallback diagnostics
        if: steps.live.outcome == 'failure'
        continue-on-error: true
        run: python scripts/validate_industry_data.py
      - name: Collect public industry, capital-flow and ETF-share history
        if: always() && !cancelled() && steps.live.outcome == 'success'
        continue-on-error: true
        env:
          TZ: Asia/Shanghai
        run: python scripts/collect_research_modules.py
      - name: Run point-in-time industry momentum backtest
        if: always() && !cancelled()
        run: python scripts/backtest_industry.py
      - name: Build evidence-labelled research modules and 12-section report
        if: always() && !cancelled()
        run: python scripts/enrich_research_snapshot.py
      - name: Validate final industry data contract
        if: always() && !cancelled()
        run: python scripts/validate_industry_data.py
      - name: Validate privacy boundary and static data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("site/data")
          latest = json.loads((root / "latest.json").read_text(encoding="utf-8"))
          research = json.loads((root / "research.json").read_text(encoding="utf-8"))
          assert research["privacy"] == "public_research_only"
          assert latest["coverage"]["valid_stock_count"] >= 2500
          assert latest["data_status"] in {"validated", "stale"}
          assert not any(k in research["sections"] for k in ("portfolio", "evidence", "personal_accounts"))
          if "reports" in research["sections"] and research["sections"]["reports"].get("items"):
              report = research["sections"]["reports"]["items"][0]["markdown"]
              assert all(f"## {i}." in report for i in range(1, 13))
          assert "backtest" in research["sections"]
          assert research["sections"].get("reports", {}).get("items")
          print("Validated public snapshot:", latest["trade_date"], latest["coverage"]["valid_stock_count"])
          PY
      - name: Commit public market data and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports site/data
          if ! git diff --cached --quiet; then
            git commit -m "chore: update cloud market snapshot and research report"
            git push origin HEAD:main
          fi
      - name: Publish static dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
          force_orphan: true
