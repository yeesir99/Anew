name: A-Share Alpha Radar — public GitHub cloud runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'requirements.txt'
      - 'site/**'
      - '.github/workflows/cloud-public.yml'
  schedule:
    - cron: "35 11 * * 1-5" # 19:35 Asia/Shanghai, after the close

permissions:
  contents: write

concurrency:
  group: anew-public-cloud-v2
  cancel-in-progress: true

jobs:
  collect-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout public research source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install public research dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q src scripts
      - name: Run focused unit tests
        run: python -m unittest discover -s tests -v
      - name: Collect latest public A-share market data
        id: live
        timeout-minutes: 15
        continue-on-error: true
        env:
          MAX_HISTORY_STOCKS: "100"
          HISTORY_WORKERS: "3"
          TZ: Asia/Shanghai
        run: python -m src.main close
      - name: Download and validate official Tongdaxin daily archive
        if: steps.live.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        env:
          TZ: Asia/Shanghai
        run: python scripts/collect_tdx_daily.py
      - name: Collect Chinese-language A-share news
        if: always() && !cancelled()
        continue-on-error: true
        timeout-minutes: 4
        run: python scripts/collect_chinese_news.py
      - name: Build broad-market technical indicators and accelerate full-universe history backfill
        if: steps.live.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 25
        env:
          MAX_HISTORY_STOCKS: "1000"
          HISTORY_WORKERS: "3"
        run: |
          if ! python scripts/build_market_technicals.py; then
            python -c 'import json; from datetime import datetime, timezone; from pathlib import Path; p=Path("data/technical_coverage.json"); r=json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}; r["status"]="degraded"; r["last_attempt_at"]=datetime.now(timezone.utc).isoformat(timespec="seconds"); r["last_attempt_error"]="technical builder exited abnormally; previous values retained and not relabelled as fresh"; p.write_text(json.dumps(r, ensure_ascii=False, indent=2)+"\\n", encoding="utf-8"); print(json.dumps({"technical_status":"degraded","last_attempt_error":r["last_attempt_error"]}))'
          fi
      - name: Build broad-market historical PE/PB valuation snapshot
        if: steps.live.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 8
        env:
          TZ: Asia/Shanghai
        run: python scripts/build_valuation_snapshot.py
      - name: Collect validated archive fallback if live API is unavailable
        if: steps.live.outcome == 'failure'
        env:
          RADAR_OUTPUT_DIR: .cache/public-fallback
          RADAR_MAX_DATA_AGE_DAYS: "7"
          RADAR_MAX_WEEKDAY_GAP: "5"
          TZ: Asia/Shanghai
        run: python scripts/collect_public.py
      - name: Import six months of public sector archive history
        if: always() && !cancelled()
        timeout-minutes: 12
        continue-on-error: true
        run: python scripts/import_sector_archive.py
      - name: Run industry momentum backtest (or mark warming up)
        if: always() && !cancelled()
        run: python scripts/backtest_industry.py
      - name: Build validated static dashboard data
        env:
          TZ: Asia/Shanghai
        run: python scripts/build_site_snapshot.py
      - name: Pre-enrichment fallback diagnostics
        if: steps.live.outcome == 'failure'
        continue-on-error: true
        run: python scripts/validate_industry_data.py
      - name: Clear previous research-source status before current collection
        if: always() && !cancelled()
        run: rm -f data/research_sources.json
      - name: Collect public industry, capital-flow and ETF-share history
        if: always() && !cancelled() && steps.live.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 12
        env:
          TZ: Asia/Shanghai
        run: python scripts/collect_research_modules.py
      - name: Run point-in-time industry momentum backtest
        if: always() && !cancelled()
        run: python scripts/backtest_industry.py
      - name: Build evidence-labelled research modules and 12-section report
        if: always() && !cancelled()
        run: python scripts/enrich_research_snapshot.py
      - name: Collect auditable theme evidence (financials, forecasts, holdings, contracts, announcements)
        if: always() && !cancelled()
        continue-on-error: true
        timeout-minutes: 8
        env:
          TZ: Asia/Shanghai
        run: python scripts/collect_theme_evidence.py
      - name: Validate theme evidence joins and coverage
        if: always() && !cancelled()
        continue-on-error: true
        run: python scripts/validate_theme_evidence.py
      - name: Validate final industry data contract
        if: always() && !cancelled()
        run: python scripts/validate_industry_data.py
      - name: Build explicit research-data quality contract
        if: always() && !cancelled()
        run: python scripts/build_research_quality.py
      - name: Validate privacy boundary and static data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("site/data")
          latest = json.loads((root / "latest.json").read_text(encoding="utf-8"))
          research = json.loads((root / "research.json").read_text(encoding="utf-8"))
          assert research["privacy"] == "public_research_only"
          for news_name in ("latest_news.json", "morning_news.json"):
              news_path = Path("data") / news_name
              if news_path.exists():
                  news_items = json.loads(news_path.read_text(encoding="utf-8"))
                  assert all(item.get("language") == "Chinese" for item in news_items), news_name
                  assert all(item.get("title") and item.get("published") for item in news_items), news_name
          news_status_path = Path("data") / "news_collection_status.json"
          if news_status_path.exists():
              news_status = json.loads(news_status_path.read_text(encoding="utf-8"))
              assert news_status["records"] >= 0
              assert news_status["status"] in {"success", "empty"}
          assert latest["coverage"]["valid_stock_count"] >= 2500
          assert latest["data_status"] in {"validated", "stale"}
          assert not any(k in research["sections"] for k in ("portfolio", "evidence", "personal_accounts"))
          if "reports" in research["sections"] and research["sections"]["reports"].get("items"):
              report = research["sections"]["reports"]["items"][0]["markdown"]
              assert all(f"## {i}." in report for i in range(1, 13))
          assert "backtest" in research["sections"]
          assert research["sections"].get("reports", {}).get("items")
          print("Validated public snapshot:", latest["trade_date"], latest["coverage"]["valid_stock_count"])
          PY
      - name: Commit public market data and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports site/data
          if ! git diff --cached --quiet; then
            git commit -m "chore: update cloud market snapshot and research report"
            git push origin HEAD:main
          fi
      - name: Publish static dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
          force_orphan: true
